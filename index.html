<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/gapwise-favicon-v2.svg" type="image/svg+xml" id="app-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/desktop-gap-plan-fixes.css" />
    <link rel="stylesheet" href="/timetable-card-fixes.css" />
    <style>
      /*
       * MapLibre owns this dimensionless anchor's geographic transform. The
       * interactive entrance button is positioned independently around the
       * projected point, so hover/focus/selection sizing cannot change the
       * anchor box or participate in MapLibre's coordinate transform.
       */
      .maplibregl-marker.map-entrance-marker-anchor {
        box-sizing: border-box !important;
        width: 0 !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        pointer-events: none !important;
        translate: none !important;
        rotate: none !important;
        scale: none !important;
        transform-origin: 50% 50% !important;
      }

      .map-entrance-marker-anchor > .map-entrance-marker {
        position: absolute;
        left: 0;
        top: 0;
        translate: -50% -50%;
        pointer-events: auto;
      }

      .map-entrance-marker.is-selected {
        outline: 2px solid color-mix(in srgb, var(--color-accent) 55%, transparent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
